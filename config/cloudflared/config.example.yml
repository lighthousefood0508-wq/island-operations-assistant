# Copy to a local, ignored config.yml only after the Owner authorizes a named Tunnel.
# Do not commit the real tunnel ID, credentials file, hostname, token, or certificate.
tunnel: <OWNER_AUTHORIZED_TUNNEL_UUID>
credentials-file: C:\Users\<WINDOWS_USER>\.cloudflared\<OWNER_AUTHORIZED_TUNNEL_UUID>.json

ingress:
  - hostname: <OWNER_CONFIGURED_ROS_HOSTNAME>
    service: http://127.0.0.1:3090
  - service: http_status:404
