limit_req_zone $binary_remote_addr zone=ros_login:10m rate=10r/m;

server {
    listen 80;
    server_name ROS_PUBLIC_HOSTNAME;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ROS_PUBLIC_HOSTNAME;

    ssl_certificate /etc/letsencrypt/live/ROS_PUBLIC_HOSTNAME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ROS_PUBLIC_HOSTNAME/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    client_max_body_size 100k;

    location = /api/auth/login {
        limit_req zone=ros_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
    }

    location = /events {
        proxy_pass http://127.0.0.1:3090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
    }
}
